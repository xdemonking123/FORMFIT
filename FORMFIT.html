              <div className="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl">
                <h1 className="text-2xl font-bold mb-2">Smart Workout Generator</h1>
                <p className="text-slate-400 text-sm mb-6">Customize your parameters to instantly generate a tailored routine.</p>
                
                <form onSubmit={handleGenerateWorkout} className="space-y-6">
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Primary Fitness Goal</label>
                    <select 
                      value={genGoal} 
                      onChange={(e) => setGenGoal(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 text-slate-200"
                    >
                      <option value="Build Muscle">Build Muscle & Hypertrophy</option>
                      <option value="Tone & Sculpt">Tone & Sculpt Physique</option>
                      <option value="Strength">Increase Raw Strength</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Available Equipment</label>
                    <select 
                      value={genEquipment} 
                      onChange={(e) => setGenEquipment(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 text-slate-200"
                    >
                      <option value="Full Gym">Full Gym Equipment</option>
                      <option value="Dumbbells Only">Dumbbells Only</option>
                      <option value="Bodyweight">Bodyweight / Calisthenics</option>
                    </select>
                  </div>

                  <button 
                    type="submit"
                    className="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3.5 rounded-xl text-sm transition-all shadow-lg shadow-orange-600/25"
                  >
                    Generate Custom Routine
                  </button>
                </form>

                {generatedRoutine && (
                  <div className="mt-8 pt-8 border-t border-slate-800">
                    <h3 className="text-lg font-bold mb-4 text-orange-400">Your Custom Routine</h3>
                    <div className="space-y-3">
                      {generatedRoutine.map((item, idx) => (
                        <div key={idx} className="bg-slate-950 border border-slate-800 p-4 rounded-xl flex items-center justify-between">
                          <div>
                            <h4 className="font-semibold text-sm">{item.name}</h4>
                            <span className="text-xs text-orange-400">{item.muscle} • 3 Sets x 10-12 Reps</span>
                          </div>
                          <button 
                            onClick={() => setSelectedExercise(item)}
                            className="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300 font-medium transition-colors"
                          >
                            View
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            ) : activeTab === 'tracker' ? (
              <div className="max-w-2xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl">
                <div className="flex justify-between items-center mb-2">
                  <h1 className="text-2xl font-bold">Live Workout Tracker</h1>
                  <div className="flex gap-2">
                    <button onClick={() => startTimer(30)} className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg">30s Rest</button>
                    <button onClick={() => startTimer(60)} className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg">60s Rest</button>
                    <button onClick={() => startTimer(90)} className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg">90s Rest</button>
                  </div>
                </div>
                <p className="text-slate-400 text-sm mb-6">Log your sets, weights, and reps during your gym session.</p>

                <form onSubmit={handleAddSet} className="bg-slate-950 border border-slate-800 p-5 rounded-2xl mb-8 space-y-4">
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Select Exercise</label>
                    <select 
                      value={trackerExercise} 
                      onChange={(e) => setTrackerExercise(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 text-slate-200"
                    >
                      {EXERCISES_DATA.map(ex => (
                        <option key={ex.id} value={ex.name}>{ex.name}</option>
                      ))}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Weight (lbs/kg)</label>
                      <input 
                        type="number" 
                        placeholder="e.g. 135"
                        value={trackerWeight}
                        onChange={(e) => setTrackerWeight(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 text-slate-200"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Reps</label>
                      <input 
                        type="number" 
                        placeholder="e.g. 10"
                        value={trackerReps}
                        onChange={(e) => setTrackerReps(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 text-slate-200"
                      />
                    </div>
                  </div>

                  <button 
                    type="submit"
                    className="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-xl text-sm transition-all shadow-lg shadow-orange-600/20"
                  >
                    + Log Set & Start Rest Timer
                  </button>
                </form>

                <div>
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-lg font-bold text-orange-400">Session Log History</h3>
                    <span className="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-full font-medium">
                      {workoutLog.length} sets logged
                    </span>
                  </div>

                  {workoutLog.length === 0 ? (
                    <div className="text-center py-10 bg-slate-950/40 rounded-2xl border border-dashed border-slate-800 text-slate-500 text-sm">
                      No sets logged yet. Fill out the form above to record your sets!
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {workoutLog.map((log) => (
                        <div key={log.id} className="bg-slate-950 border border-slate-800 p-4 rounded-xl flex items-center justify-between">
                          <div>
                            <h4 className="font-semibold text-sm text-slate-200">{log.exercise}</h4>
                            <span className="text-xs text-orange-400 font-medium">
                              {log.weight} units × {log.reps} reps
                            </span>
                          </div>
                          <div className="flex items-center gap-4">
                            <span className="text-xs text-slate-500">{log.timestamp}</span>
                            <button 
                              onClick={() => handleRemoveSet(log.id)}
                              className="text-xs text-red-400 hover:text-red-300 bg-red-500/10 border border-red-500/20 px-2.5 py-1 rounded-lg transition-colors"
                            >
                              Remove
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            ) : activeTab === 'stats' ? (
              <div className="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl">
                <h1 className="text-2xl font-bold mb-2">Workout Stats & Overview</h1>
                <p className="text-slate-400 text-sm mb-6">Review your daily training volume and milestones.</p>
                
                <div className="grid grid-cols-2 gap-4 mb-6">
                  <div className="bg-slate-950 border border-slate-800 p-5 rounded-2xl">
                    <span className="text-xs uppercase tracking-wider text-slate-400 font-bold">Total Sets Logged</span>
                    <h3 className="text-3xl font-black text-orange-400 mt-2">{workoutLog.length}</h3>
                  </div>
                  <div className="bg-slate-950 border border-slate-800 p-5 rounded-2xl">
                    <span className="text-xs uppercase tracking-wider text-slate-400 font-bold">Exercises Available</span>
                    <h3 className="text-3xl font-black text-amber-400 mt-2">{EXERCISES_DATA.length}</h3>
                  </div>
                </div>

                <div className="bg-orange-500/10 border border-orange-500/20 rounded-2xl p-5">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-orange-400 mb-1">Consistency Badge</h4>
                  <p className="text-sm text-orange-200/90">Keep logging your sets in the Tracker tab to build up your streak!</p>
                </div>
              </div>
            ) : (
              <div className="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 text-center shadow-2xl">
                <div className="w-20 h-20 bg-orange-600/20 text-orange-400 rounded-full flex items-center justify-center text-3xl font-black mx-auto mb-4 border border-orange-500/30 shadow-lg shadow-orange-600/20">
                  T
                </div>
                <h1 className="text-2xl font-bold mb-1">About the Creator</h1>
                <p className="text-slate-400 text-sm mb-6">Meet the developer behind FormFit!</p>
                
                <div className="bg-slate-950 border border-slate-800 p-6 rounded-2xl space-y-4 text-left shadow-inner">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                    <span className="text-xs uppercase tracking-wider text-slate-400 font-bold">Developer Name</span>
                    <span className="text-sm font-bold text-orange-400">Tejas</span>
                  </div>
                  <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                    <span className="text-xs uppercase tracking-wider text-slate-400 font-bold">School</span>
                    <span className="text-sm font-bold text-slate-200">VIDYA SOUDHA PUBLIC SCHOOL</span>
                  </div>
                  <div className="flex justify-between items-center">
                    <span className="text-xs uppercase tracking-wider text-slate-400 font-bold">Classroom</span>
                    <span className="text-sm font-bold text-slate-200">8D</span>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
